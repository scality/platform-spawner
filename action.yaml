name: platform-spawner
description: Spawn and destroy platforms

inputs:
  action:
    description: "The action to perform (setup, list, spawn or destroy)"
    required: false
    default: "spawn"
    
  instance_image:
    description: "Image for the instances (e.g.: AMI name for AWS)"
    required: true
    default: "rocky-8"

  # AWS credentials
  aws_access_key_id:
    description: "The AWS access key"
    required: false
  aws_secret_key:
    description: "The AWS secret key"
    required: false
  aws_region:
    description: "The AWS region"
    required: false

  # Scaleway credentials
  scaleway_access_key:
    description: "The Scaleway access key"
    required: false
  scaleway_secret_key:
    description: "The Scaleway secret key"
    required: false
  scaleway_project_id:
    description: "The Scaleway project ID"
    required: false

  # SSH key options:
  # 1. Default (no config): Scaleway provides all IAM keys to instance
  # 2. ssh_key_name: Use an existing SSH key by name from cloud provider
  # 3. ssh_private_key_create: Generate a new keypair (registered in IAM + cloud-init)
  # 4. ssh_public_key: Provide a public key (registered in IAM + cloud-init)
  ssh_key_name:
    description: "Name of an existing SSH key in the cloud provider to use"
    required: false
    default: ""
  ssh_private_key_create:
    description: "Whether to generate a new SSH keypair (the public key will be added to cloud provider and cloud-init)"
    required: false
    default: "false"
  ssh_public_keys:
    description: "SSH public keys to add to the cloud provider and inject in cloud-init (for instance access)"
    required: false
    default: "[]"

  product:
    description: "The product name"
    required: false
    default: ""
  authorized_cidrs:
    description: "JSON array or comma-separated list of authorized CIDRs for bastion access (e.g., [\"203.0.113.10/32\",\"198.51.100.0/24\"] or '203.0.113.10/32,198.51.100.0/24')"
    required: false
    default: ""
  custom_routes:
    description: "JSON array of custom VPC routes (e.g., [{\"destination\": \"35.241.243.135/32\", \"description\": \"artifacts.scality.net\"}])"
    required: false
    default: ""

  # Artifacts credentials
  artifacts_user:
    description: "The artifacts user (only for spawn action)"
    required: false
    default: ""
  artifacts_password:
    description: "The artifacts password (only for spawn action)"
    required: false
    default: ""

  # Pulumi stack name
  stack_name:
    description: "The name of the stack (must be unique) (needed for spawn and delete action)"
    required: false
    default: ""
  store_to_s3:
    description: "Whether to store the stack output in S3 (needed for garbage collection)"
    required: false
    default: "true"

  # Spawn specific
  configuration:
    description: "The configuration for the Pulumi stack (yaml format - only for spawn action)"
    required: false
    default: ""

  # List specific
  age:
    description: "The age in hours to list stacks (only for list action)"
    required: false
    default: ""

outputs:
  bastion:
    description: "The bastion output (only for spawn action)"
    value: ${{ steps.spawn_outputs.outputs.bastion || '' }}
  nodes:
    description: "The nodes output (only for spawn action)"
    value: ${{ steps.spawn_outputs.outputs.nodes || '' }}
  stacks_list:
    description: "The list of stacks older than the given age (only for list action)"
    value: ${{ steps.list_stacks.outputs.STACKS_LIST || '[]' }}

runs:
  using: "composite"
  steps:
    - name: Install Python 3
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: "Check action"
      shell: bash
      run: |
        case ${{ inputs.action }} in
          setup|list|spawn|destroy) ;;
          *)
            echo "Invalid action: ${{ inputs.action }}. Must be 'setup', 'list', 'spawn' or 'destroy'."
            exit 1
            ;;
        esac
    - name: "Check argument for spawn"
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      run: |
        if [ "${{ inputs.configuration }}" == "" ]; then
          echo "Configuration must be provided for spawn action."
          exit 1
        fi
    - name: "Check stack argument"
      if: ${{ inputs.action == 'destroy' || inputs.action == 'spawn' }}
      shell: bash
      run: |
        if [ "${{ inputs.stack_name }}" == "" ]; then
          echo "Stack name must be provided for spawn actions."
          exit 1
        fi
    - name: "Check argument for list"
      if: ${{ inputs.action == 'list' }}
      shell: bash
      run: |
        if [ "${{ inputs.age }}" == "" ]; then
          echo "Age must be provided for list action."
          exit 1
        fi
        if ! [[ "${{ inputs.age }}" =~ ^[0-9]+$ ]]; then
          echo "Age must be a positive integer."
          exit 1
        fi

    # Setup (always done) {{{
    - name: Install pulumi
      shell: bash
      env:
        PULUMI_VERSION: "v3.224.0"
      run: |-
        curl --fail -L -o /tmp/pulumi.tar.gz "https://get.pulumi.com/releases/sdk/pulumi-${PULUMI_VERSION}-linux-x64.tar.gz"
        sudo tar -xzf /tmp/pulumi.tar.gz -C /usr/local/bin --strip-components=1 pulumi
        rm -rf /tmp/pulumi.tar.gz
    
    - name: Install AWS CLI
      shell: bash
      if: ${{ fromJSON(inputs.store_to_s3) }}
      run: |
        if command -v aws &> /dev/null; then
          echo "✓ AWS CLI already installed: $(aws --version)"
        else
          echo "Installing AWS CLI..."
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -qq awscliv2.zip
          sudo ./aws/install
          rm -rf awscliv2.zip aws
          echo "✓ AWS CLI installed: $(aws --version)"
        fi

    - name: Install uv
      shell: bash
      env:
        UV_VERSION: "0.8.13"
      run: |-
        curl --fail -L -o /tmp/uv.tar.gz "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
        sudo tar -xzf /tmp/uv.tar.gz -C /usr/local/bin --strip-components=1 uv-x86_64-unknown-linux-gnu
        rm -rf /tmp/uv.tar.gz

    - name: Install Python dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        uv pip install --system -r requirements.txt

    # Set environment variables
    - name: Set environment variables
      shell: bash
      run: |-
        echo "AWS_ACCESS_KEY_ID=${{ inputs.aws_access_key_id }}" >> "$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=${{ inputs.aws_secret_key }}" >> "$GITHUB_ENV"
        echo "AWS_REGION=${{ inputs.aws_region }}" >> "$GITHUB_ENV"

        echo "SCW_ACCESS_KEY=${{ inputs.scaleway_access_key }}" >> "$GITHUB_ENV"
        echo "SCW_SECRET_KEY=${{ inputs.scaleway_secret_key }}" >> "$GITHUB_ENV"
        echo "SCW_DEFAULT_PROJECT_ID=${{ inputs.scaleway_project_id }}" >> "$GITHUB_ENV"

        echo "PULUMI_DEFAULT_ARGS=--color always --non-interactive" >> "$GITHUB_ENV"
        echo "PULUMI_CONFIG_PASSPHRASE=" >> "$GITHUB_ENV"

    - name: Set stack variables
      if: ${{ inputs.stack_name != '' }}
      shell: bash
      run: |-
        STACK_NAME=$(echo "${{ inputs.stack_name }}" | sed 's/ /-/g')
        echo "STACK_NAME=$STACK_NAME" >> "$GITHUB_ENV"
        echo "PULUMI_STACK_FILE=Pulumi.$STACK_NAME.yaml" >> "$GITHUB_ENV"

    - name: Login locally
      shell: bash
      if: ${{ ! fromJSON(inputs.store_to_s3) }}
      working-directory: ${{ github.action_path }}
      run: |-
        pulumi $PULUMI_DEFAULT_ARGS login "file://./"
    # }}}

    # Login to s3
    - name: Login to the s3 bucket
      shell: bash
      if: ${{ fromJSON(inputs.store_to_s3) }}
      working-directory: ${{ github.action_path }}
      env:
        SCW_DEFAULT_REGION: fr-par
        SCW_S3_ENDPOINT_URL: https://s3.fr-par.scw.cloud
        SCW_S3_ACCESS_KEY: ${{ inputs.scaleway_access_key }}
        SCW_S3_SECRET_KEY: ${{ inputs.scaleway_secret_key }}
      run: |-
        # Configure AWS CLI for Pulumi S3 backend
        aws configure set aws_access_key_id "${{ env.SCW_S3_ACCESS_KEY }}"
        aws configure set aws_secret_access_key "${{ env.SCW_S3_SECRET_KEY }}"
        aws configure set default.region "${{ env.SCW_DEFAULT_REGION }}"
        aws configure set default.s3.endpoint_url "${{ env.SCW_S3_ENDPOINT_URL }}"
        
        # Set AWS environment variables for Pulumi (persist across steps)
        echo "AWS_ACCESS_KEY_ID=$SCW_S3_ACCESS_KEY" >> "$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=$SCW_S3_SECRET_KEY" >> "$GITHUB_ENV"
        echo "AWS_REGION=$SCW_DEFAULT_REGION" >> "$GITHUB_ENV"
        echo "AWS_ENDPOINT_URL=$SCW_S3_ENDPOINT_URL" >> "$GITHUB_ENV"
        
        pulumi $PULUMI_DEFAULT_ARGS login "s3://artesca-stacks?endpoint=${{ env.SCW_S3_ENDPOINT_URL }}"

    # List {{{
    - name: List stacks
      if: ${{ inputs.action == 'list' }}
      id: list_stacks
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        stack_list=$(
          pulumi stack ls --json |
          jq -rc '[.[] | select(
            (.lastUpdate | sub("\\.\\d+Z"; "Z") | fromdateiso8601) < (now - (3600 * ${{ inputs.age }}))
          ) | .name]'
        )
        echo "STACKS_LIST=$stack_list" >> "$GITHUB_OUTPUT"

    # Spawn {{{
    # Prepare stack config
    - name: Fill the stack
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        python -c '
        import yaml, sys
        user_config = yaml.safe_load(sys.stdin) or {}
        # Prefix all config keys with "platform-spawner:" for Pulumi
        pulumi_config = {"config": {f"platform-spawner:{k}": v for k, v in user_config.items()}}
        print(yaml.safe_dump(pulumi_config))
        ' <<< "${{ inputs.configuration }}" > "$PULUMI_STACK_FILE"
    - name: Create stack
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        pulumi $PULUMI_DEFAULT_ARGS stack init "$STACK_NAME"
    - name: Set some defaults
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        SSH_KEYS_INPUT: ${{ inputs.ssh_public_keys }}
      run: |-
        pulumi $PULUMI_DEFAULT_ARGS config set project_id "${{ inputs.scaleway_project_id }}"
        if [[ "$(pulumi $PULUMI_DEFAULT_ARGS config get product)" == "unknown" ]]; then
          pulumi $PULUMI_DEFAULT_ARGS config set product "${{ inputs.product || github.event.repository.name }}"
        fi
        if [[ "${{ inputs.authorized_cidrs }}" != "" ]]; then
          # Use Python to properly parse and write the JSON array to the config file
          # Pass via environment variable to avoid bash quote mangling
          CIDRS_INPUT='${{ inputs.authorized_cidrs }}' python -c "import yaml,json,sys,os; config = yaml.safe_load(open('$PULUMI_STACK_FILE')); cidrs_input = os.environ['CIDRS_INPUT']; config.setdefault('config', {})['platform-spawner:authorized_cidrs'] = json.loads(cidrs_input) if cidrs_input.strip().startswith('[') else [x.strip() for x in cidrs_input.split(',')]; yaml.safe_dump(config, open('$PULUMI_STACK_FILE', 'w'))"
        fi
        if [[ "${{ inputs.custom_routes }}" != "" ]]; then
          # Custom routes must be a JSON array
          ROUTES_INPUT='${{ inputs.custom_routes }}' python -c "import yaml,json,sys,os; config = yaml.safe_load(open('$PULUMI_STACK_FILE')); routes_input = os.environ['ROUTES_INPUT']; config.setdefault('config', {})['platform-spawner:custom_routes'] = json.dumps(json.loads(routes_input)); yaml.safe_dump(config, open('$PULUMI_STACK_FILE', 'w'))"
        fi
        
        # SSH configuration - explicitly set to avoid using previous stack values
        if [[ "${{ inputs.ssh_key_name }}" != "" ]]; then
          pulumi $PULUMI_DEFAULT_ARGS config set ssh_key_name "${{ inputs.ssh_key_name }}"
        else
          pulumi $PULUMI_DEFAULT_ARGS config rm ssh_key_name || true
        fi
        if [[ -n "$SSH_KEYS_INPUT" ]] && [[ "$SSH_KEYS_INPUT" != "[]" ]]; then
          # Use Python to properly parse and write the JSON array to the config file
          python -c "import yaml,json,sys,os; config = yaml.safe_load(open('$PULUMI_STACK_FILE')); ssh_keys_input = os.environ['SSH_KEYS_INPUT']; config.setdefault('config', {})['platform-spawner:ssh_public_keys'] = json.loads(ssh_keys_input); yaml.safe_dump(config, open('$PULUMI_STACK_FILE', 'w'))"
        else
          pulumi $PULUMI_DEFAULT_ARGS config rm ssh_public_keys || true
        fi
        if [[ "${{ inputs.ssh_private_key_create }}" == "true" ]]; then
          pulumi $PULUMI_DEFAULT_ARGS config set --type bool ssh_private_key_create true
        else
          pulumi $PULUMI_DEFAULT_ARGS config set --type bool ssh_private_key_create false
        fi
        
        pulumi $PULUMI_DEFAULT_ARGS config set --type bool disable_auto_stop true

    # Preview and spawn
    - name: Preview
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        pulumi $PULUMI_DEFAULT_ARGS preview
    - name: Spawn
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        pulumi $PULUMI_DEFAULT_ARGS up --yes --skip-preview

    - name: Store stack to S3
      if: ${{ inputs.action == 'spawn' && fromJSON(inputs.store_to_s3) }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        SCW_DEFAULT_REGION: fr-par
        SCW_S3_ACCESS_KEY: ${{ inputs.scaleway_access_key }}
        SCW_S3_SECRET_KEY: ${{ inputs.scaleway_secret_key }}
        SCW_S3_ENDPOINT_URL: https://s3.fr-par.scw.cloud
      run: |-
        aws configure set aws_access_key_id "$SCW_S3_ACCESS_KEY"
        aws configure set aws_secret_access_key "$SCW_S3_SECRET_KEY"
        aws configure set default.region "$SCW_DEFAULT_REGION"

        S3_KEY="artesca-stacks/${{ github.event.repository.name }}/${{ env.STACK_NAME }}"

        pulumi $PULUMI_DEFAULT_ARGS stack export --file stack_export.json
        aws s3 cp stack_export.json "s3://$S3_KEY/stack_export.json" \
          --endpoint-url "$SCW_S3_ENDPOINT_URL" \
          --metadata "project=${{ github.event.repository.name }},type=stack,build=${{ github.run_number }},from=${{ github.workflow }},commit=${{ github.sha }},branch=${{ github.ref_name }},build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ),workflow-run=${{ github.run_id }}"
        rm -f stack_export.json

        pulumi $PULUMI_DEFAULT_ARGS stack output --json > stack_output.json
        aws s3 cp stack_output.json "s3://$S3_KEY/stack_output.json" \
          --endpoint-url "$SCW_S3_ENDPOINT_URL" \
          --metadata "project=${{ github.event.repository.name }},type=stack,build=${{ github.run_number }},from=${{ github.workflow }},commit=${{ github.sha }},branch=${{ github.ref_name }},build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ),workflow-run=${{ github.run_id }}"
        rm -f stack_output.json

    # Add symlink to ssh_config to workspace
    - name: Copy SSH config
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        TARGET: "${{ github.workspace }}/ssh_config"
      run: |-
        if [ ! -e "$TARGET" ]; then
          ln -s "$(pulumi $PULUMI_DEFAULT_ARGS stack output ssh_config)" "$TARGET"
        fi

    # # Save stack
    # - name: Prepare artifacts
    #   if: ${{ inputs.action == 'spawn' && always() }}
    #   shell: bash
    #   working-directory: ${{ github.action_path }}
    #   env:
    #     OUT_DIR: "${{ github.workspace }}/_platform_artifacts/.platform_spawner/${{ env.STACK_NAME }}"
    #   run: |-
    #     mkdir -p "$OUT_DIR"
    #     pulumi stack export --file "$OUT_DIR/stack.json"
    #
    #     cp "$(pulumi $PULUMI_DEFAULT_ARGS stack output ssh_config)" "$OUT_DIR/"
    #
    #     if [[ "$(pulumi $PULUMI_DEFAULT_ARGS config get ssh_private_key_create)" == "true" ]]; then
    #       ssh_key=$(pulumi $PULUMI_DEFAULT_ARGS stack output ssh_info | jq -r '.key')
    #       cp "$ssh_key" "$OUT_DIR/"
    #       cp "$ssh_key.pub" "$OUT_DIR/"
    #     fi
    # - name: Upload artifacts
    #   if: ${{ inputs.action == 'spawn' && always() }}
    #   uses: scality/action-artifacts@v4
    #   with:
    #     method: upload
    #     url: https://artifacts.scality.net
    #     user: ${{ inputs.artifacts_user }}
    #     password: ${{ inputs.artifacts_password }}
    #     source: "${{ github.workspace }}/_platform_artifacts"

    # Add step summary
    - name: Step Summary
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        cat << "EOF" >> "$GITHUB_STEP_SUMMARY"
        # Platform Spawner for ${{ env.STACK_NAME }}

        <details>
        <summary>Configuration used</summary>

        ```yaml
        EOF
        cat "$PULUMI_STACK_FILE" >> "$GITHUB_STEP_SUMMARY"
        cat << "EOF" >> "$GITHUB_STEP_SUMMARY"
        ```
        </details>

        <details>
        <summary>Spawn output</summary>

        ```json
        EOF
        pulumi $PULUMI_DEFAULT_ARGS stack output --json >> "$GITHUB_STEP_SUMMARY"
        cat << "EOF" >> "$GITHUB_STEP_SUMMARY"
        ```
        </details>
        EOF

    # Add outputs
    - name: Set outputs
      if: ${{ inputs.action == 'spawn' }}
      id: spawn_outputs
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        echo "bastion<<EOF" >> "$GITHUB_OUTPUT"
        pulumi $PULUMI_DEFAULT_ARGS stack output bastion --json >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        echo "nodes<<EOF" >> "$GITHUB_OUTPUT"
        pulumi $PULUMI_DEFAULT_ARGS stack output nodes --json >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
    # }}}

    # Destroy {{{
    - name: Recover stack info from S3
      if: ${{ inputs.action == 'destroy' && fromJSON(inputs.store_to_s3) }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        SCW_DEFAULT_REGION: fr-par
        SCW_S3_ACCESS_KEY: ${{ inputs.scaleway_access_key }}
        SCW_S3_SECRET_KEY: ${{ inputs.scaleway_secret_key }}
        SCW_S3_ENDPOINT_URL: https://s3.fr-par.scw.cloud
      run: |-
        aws configure set aws_access_key_id "$SCW_S3_ACCESS_KEY"
        aws configure set aws_secret_access_key "$SCW_S3_SECRET_KEY"
        aws configure set default.region "$SCW_DEFAULT_REGION"
        
        S3_KEY="artesca-stacks/${{ github.event.repository.name }}/${{ env.STACK_NAME }}.json"
        
        echo "Downloading stack info from S3..."
        if aws s3 cp "s3://$S3_KEY" stack.json \
          --endpoint-url "$SCW_S3_ENDPOINT_URL" 2>/dev/null; then
          echo "✓ Stack info recovered from S3:"
          cat stack.json | jq '.' || cat stack.json
        else
          echo "⚠ No stack info found in S3 (this is okay if stack was created with store_to_s3: false)"
        fi
    
    - name: Refresh the config
      if: ${{ inputs.action == 'destroy' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        pulumi stack select "$STACK_NAME"
    - name: Set mandatory config
      if: ${{ inputs.action == 'destroy' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      # NOTE: We set mandatory config flags otherwise pulumi destroy fails because
      # some config is missing
      run: >-
        pulumi $PULUMI_DEFAULT_ARGS config refresh ||
          pulumi $PULUMI_DEFAULT_ARGS config set instance_image rocky-8
    - name: Destroy
      if: ${{ inputs.action == 'destroy' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        pulumi $PULUMI_DEFAULT_ARGS cancel --yes || true
        pulumi $PULUMI_DEFAULT_ARGS destroy --yes
    - name: Remove the stack
      if: ${{ inputs.action == 'destroy' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        pulumi $PULUMI_DEFAULT_ARGS stack rm --yes --remove-backups
    
    - name: Delete stack from S3
      if: ${{ inputs.action == 'destroy' && fromJSON(inputs.store_to_s3) }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        SCW_DEFAULT_REGION: fr-par
        SCW_S3_ACCESS_KEY: ${{ inputs.scaleway_access_key }}
        SCW_S3_SECRET_KEY: ${{ inputs.scaleway_secret_key }}
        SCW_S3_ENDPOINT_URL: https://s3.fr-par.scw.cloud
      run: |-
        aws configure set aws_access_key_id "$SCW_S3_ACCESS_KEY"
        aws configure set aws_secret_access_key "$SCW_S3_SECRET_KEY"
        aws configure set default.region "$SCW_DEFAULT_REGION"
        
        S3_KEY="artesca-stacks/${{ github.event.repository.name }}/${{ env.STACK_NAME }}.json"
        
        echo "Deleting stack info from S3..."
        if aws s3 rm "s3://$S3_KEY" \
          --endpoint-url "$SCW_S3_ENDPOINT_URL" 2>/dev/null; then
          echo "✓ Stack info deleted from S3"
        else
          echo "⚠ Stack info not found in S3 (may have been already deleted)"
        fi

    # }}}