name: platform-spawner
description: Spawn and destroy platforms

inputs:
  action:
    description: "The action to perform (setup, list, spawn, snapshot, delete-snapshot or destroy)"
    required: true
    default: "spawn"

  # Artifacts credentials
  artifacts_user:
    description: "The artifacts user (only for spawn action)"
    required: false
    default: ""
  artifacts_password:
    description: "The artifacts password (only for spawn action)"
    required: false
    default: ""

  # What the platform belongs to, naming both its resources and its snapshots
  product:
    description: "Product the platform is spawned for (defaults to the repository name)"
    required: false
    default: ""

  # Pulumi stack name
  stack_name:
    description: "The name of the stack (must be unique) (needed for spawn and delete action)"
    required: false
    default: ""
  store_to_s3:
    description: "Whether to store the stack output in S3 (needed for garbage collection)"
    required: false
    default: "true"
  max_attempts:
    description: "How many times to try a spawn or a destroy before giving up"
    required: false
    default: "3"

  # Spawn specific
  configuration:
    description: "The configuration for the Pulumi stack (yaml format - only for spawn action)"
    required: false
    default: ""

  # Snapshot specific
  snapshot_name:
    description: "The name of the snapshot (only for snapshot and delete-snapshot actions)"
    required: false
    default: ""

  # List specific
  age:
    description: "The age in hours to list stacks (only for list action)"
    required: false
    default: ""

outputs:
  bastion:
    description: "The bastion output (only for spawn action)"
    value: ${{ steps.spawn_outputs.outputs.bastion || '' }}
  nodes:
    description: "The nodes output (only for spawn action)"
    value: ${{ steps.spawn_outputs.outputs.nodes || '' }}
  stacks_list:
    description: "The list of stacks older than the given age (only for list action)"
    value: ${{ steps.list_stacks.outputs.STACKS_LIST || '[]' }}

runs:
  using: "composite"
  steps:
    - name: "Check action"
      shell: bash
      env:
        ACTION: ${{ inputs.action }}
      run: |
        case "$ACTION" in
          setup|list|spawn|snapshot|delete-snapshot|destroy) ;;
          *)
            echo "Invalid action: $ACTION. Must be 'setup', 'list', 'spawn', 'snapshot', 'delete-snapshot' or 'destroy'."
            exit 1
            ;;
        esac
    - name: "Check argument for spawn"
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      env:
        CONFIGURATION: ${{ inputs.configuration }}
      run: |
        if [ "$CONFIGURATION" == "" ]; then
          echo "Configuration must be provided for spawn action."
          exit 1
        fi
    - name: "Check stack argument"
      if: ${{ inputs.action == 'destroy' || inputs.action == 'spawn' || inputs.action == 'snapshot' }}
      shell: bash
      env:
        STACK_NAME_INPUT: ${{ inputs.stack_name }}
      run: |
        if [ "$STACK_NAME_INPUT" == "" ]; then
          echo "Stack name must be provided for spawn actions."
          exit 1
        fi
    - name: "Check argument for snapshot"
      if: ${{ inputs.action == 'snapshot' || inputs.action == 'delete-snapshot' }}
      shell: bash
      env:
        SNAPSHOT_NAME: ${{ inputs.snapshot_name }}
      run: |
        if [ "$SNAPSHOT_NAME" == "" ]; then
          echo "Snapshot name must be provided for snapshot actions."
          exit 1
        fi
    - name: "Check max attempts"
      shell: bash
      env:
        MAX_ATTEMPTS: ${{ inputs.max_attempts }}
      run: |
        if ! [[ "$MAX_ATTEMPTS" =~ ^[1-9][0-9]*$ ]]; then
          echo "Max attempts must be a positive integer."
          exit 1
        fi
    - name: "Check argument for list"
      if: ${{ inputs.action == 'list' }}
      shell: bash
      env:
        AGE: ${{ inputs.age }}
      run: |
        if [ "$AGE" == "" ]; then
          echo "Age must be provided for list action."
          exit 1
        fi
        if ! [[ "$AGE" =~ ^[0-9]+$ ]]; then
          echo "Age must be a positive integer."
          exit 1
        fi

    # Setup (always done) {{{
    - name: Install pulumi
      shell: bash
      env:
        # renovate: datasource=github-releases depName=pulumi/pulumi
        PULUMI_VERSION: "v3.265.0"
      run: |-
        curl --fail -L -o /tmp/pulumi.tar.gz "https://get.pulumi.com/releases/sdk/pulumi-${PULUMI_VERSION}-linux-x64.tar.gz"
        sudo tar -xzf /tmp/pulumi.tar.gz -C /usr/local/bin --strip-components=1 pulumi
        rm -rf /tmp/pulumi.tar.gz
    - name: Install uv
      shell: bash
      env:
        # renovate: datasource=github-releases depName=astral-sh/uv
        UV_VERSION: "0.12.19"
      run: |-
        curl --fail -L -o /tmp/uv.tar.gz "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
        sudo tar -xzf /tmp/uv.tar.gz -C /usr/local/bin --strip-components=1 uv-x86_64-unknown-linux-gnu
        rm -rf /tmp/uv.tar.gz

    - name: Set environment variables
      shell: bash
      run: |-
        echo "PULUMI_DEFAULT_ARGS=--color always --non-interactive" >> "$GITHUB_ENV"
        echo "PULUMI_CONFIG_PASSPHRASE=" >> "$GITHUB_ENV"

    - name: Set stack variables
      if: ${{ inputs.stack_name != '' }}
      shell: bash
      env:
        STACK_NAME_INPUT: ${{ inputs.stack_name }}
      run: |-
        STACK_NAME="${STACK_NAME_INPUT// /-}"
        echo "STACK_NAME=$STACK_NAME" >> "$GITHUB_ENV"
        echo "PULUMI_STACK_FILE=Pulumi.$STACK_NAME.yaml" >> "$GITHUB_ENV"

    # Login to s3
    - name: Login to the s3 bucket
      shell: bash
      if: ${{ fromJSON(inputs.store_to_s3) }}
      working-directory: ${{ github.action_path }}
      env:
        REPOSITORY: ${{ github.event.repository.name }}
      run: |-
        pulumi $PULUMI_DEFAULT_ARGS login "s3://platform-spawner-stacks/$REPOSITORY"
    - name: Login locally
      shell: bash
      if: ${{ ! fromJSON(inputs.store_to_s3) }}
      working-directory: ${{ github.action_path }}
      run: |-
        pulumi $PULUMI_DEFAULT_ARGS login "file://./"
    # }}}

    # List {{{
    - name: List stacks
      if: ${{ inputs.action == 'list' }}
      id: list_stacks
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        AGE: ${{ inputs.age }}
      run: |-
        stack_list=$(
          pulumi stack ls --json |
          jq -rc --argjson age "$AGE" '[.[] | select(
            (.lastUpdate | sub("\\.\\d+Z"; "Z") | fromdateiso8601) < (now - (3600 * $age))
          ) | .name]'
        )
        echo "STACKS_LIST=$stack_list" >> "$GITHUB_OUTPUT"


    # Spawn {{{
    # Prepare stack config
    - name: Fill the stack
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      # NOTE: Handed over through the environment rather than interpolated into
      # the script, where a multi line value would be read as shell
      env:
        CONFIGURATION: ${{ inputs.configuration }}
      run: |-
        uv run python -c 'import yaml,sys; print(yaml.safe_dump({"config": yaml.safe_load(sys.stdin)}))' <<< "$CONFIGURATION" > "$PULUMI_STACK_FILE"
    - name: Create stack
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        pulumi $PULUMI_DEFAULT_ARGS stack init "$STACK_NAME"
    - name: Set some defaults
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PRODUCT_INPUT: ${{ inputs.product }}
        REPOSITORY: ${{ github.event.repository.name }}
      run: |-
        if [[ "$(pulumi $PULUMI_DEFAULT_ARGS config get product)" == "unknown" ]]; then
          pulumi $PULUMI_DEFAULT_ARGS config set product "${PRODUCT_INPUT:-$REPOSITORY}"
        fi
        if [[ "$(pulumi $PULUMI_DEFAULT_ARGS config get ssh_key_name)" == "" ]]; then
          pulumi $PULUMI_DEFAULT_ARGS config set --type bool ssh_private_key_create true
        fi
        pulumi $PULUMI_DEFAULT_ARGS config set --type bool disable_auto_stop true

    # Preview and spawn
    - name: Preview
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        pulumi $PULUMI_DEFAULT_ARGS preview
    - name: Spawn
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        MAX_ATTEMPTS: ${{ inputs.max_attempts }}
      # NOTE: An update carries on from where the last one stopped, so trying
      # again is free of consequence and picks up whatever the cloud refused
      # to do the first time. The provider already retries a call that never
      # connects, this catches what it answers and then cannot deliver.
      #
      # The stack is not cancelled in between. It was created a few steps ago
      # so nothing else can hold it, and cancelling an update that has just
      # failed abandons whatever was in flight, which is how a port outlives
      # the stack that made it and keeps an address nobody can take back.
      run: |-
        for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
          if pulumi $PULUMI_DEFAULT_ARGS up --yes --skip-preview; then
            exit 0
          fi
          echo "Spawn failed [$attempt/$MAX_ATTEMPTS]"
          uv run --group snapshot tools/clean_orphan_ports.py || true
        done
        exit 1

    # Add symlink to ssh_config to workspace
    - name: Copy SSH config
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        TARGET: "${{ github.workspace }}/ssh_config"
      # NOTE: Forced. A runner that keeps its workspace between runs still
      # holds the link of the platform before this one, and a link that is
      # there already would otherwise be left pointing at it.
      run: |-
        ln -sf "$(pulumi $PULUMI_DEFAULT_ARGS stack output ssh_config)" "$TARGET"

    # Save stack
    - name: Prepare artifacts
      if: ${{ inputs.action == 'spawn' && always() }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        OUT_DIR: "${{ github.workspace }}/_platform_artifacts/.platform_spawner/${{ env.STACK_NAME }}"
      run: |-
        mkdir -p "$OUT_DIR"
        pulumi stack export --file "$OUT_DIR/stack.json"

        # NOTE: The artifacts directory is already named after the stack, so
        # the config is published under its stable name rather than the per
        # stack one it has in the workspace.
        cp "$(pulumi $PULUMI_DEFAULT_ARGS stack output ssh_config)" "$OUT_DIR/ssh_config"

        if [[ "$(pulumi $PULUMI_DEFAULT_ARGS config get ssh_private_key_create)" == "true" ]]; then
          ssh_key=$(pulumi $PULUMI_DEFAULT_ARGS stack output ssh_info | jq -r '.key')
          cp "$ssh_key" "$OUT_DIR/"
          cp "$ssh_key.pub" "$OUT_DIR/"
        fi
    - name: Upload artifacts
      if: ${{ inputs.action == 'spawn' && always() }}
      uses: scality/action-artifacts@v4
      with:
        method: upload
        url: https://artifacts.scality.net
        user: ${{ inputs.artifacts_user }}
        password: ${{ inputs.artifacts_password }}
        source: "${{ github.workspace }}/_platform_artifacts"

    # Add step summary
    - name: Step Summary
      if: ${{ inputs.action == 'spawn' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        echo "# Platform Spawner for $STACK_NAME" >> "$GITHUB_STEP_SUMMARY"
        cat << "EOF" >> "$GITHUB_STEP_SUMMARY"

        <details>
        <summary>Configuration used</summary>

        ```yaml
        EOF
        cat "$PULUMI_STACK_FILE" >> "$GITHUB_STEP_SUMMARY"
        cat << "EOF" >> "$GITHUB_STEP_SUMMARY"
        ```
        </details>

        <details>
        <summary>Spawn output</summary>

        ```json
        EOF
        pulumi $PULUMI_DEFAULT_ARGS stack output --json >> "$GITHUB_STEP_SUMMARY"
        cat << "EOF" >> "$GITHUB_STEP_SUMMARY"
        ```
        </details>
        EOF

    # Add outputs
    - name: Set outputs
      if: ${{ inputs.action == 'spawn' }}
      id: spawn_outputs
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        echo "bastion<<EOF" >> "$GITHUB_OUTPUT"
        pulumi $PULUMI_DEFAULT_ARGS stack output bastion --json >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        echo "nodes<<EOF" >> "$GITHUB_OUTPUT"
        pulumi $PULUMI_DEFAULT_ARGS stack output nodes --json >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
    # }}}

    # Snapshot {{{
    - name: Snapshot the platform
      if: ${{ inputs.action == 'snapshot' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      # NOTE: Handed over through the environment rather than interpolated
      # into the script, where it would be read as shell rather than as a name
      env:
        SNAPSHOT_NAME: ${{ inputs.snapshot_name }}
      run: |-
        pulumi $PULUMI_DEFAULT_ARGS stack select "$STACK_NAME"
        uv run --group snapshot tools/generate_snapshot.py "$SNAPSHOT_NAME"
    - name: Delete the snapshot
      if: ${{ inputs.action == 'delete-snapshot' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      # NOTE: Read from the input rather than from the stack, which is
      # usually gone by the time its snapshots are taken away. It is the very
      # input a spawn names the platform with, so the two always agree.
      env:
        SNAPSHOT_NAME: ${{ inputs.snapshot_name }}
        PRODUCT_INPUT: ${{ inputs.product }}
        REPOSITORY: ${{ github.event.repository.name }}
      run: |-
        uv run --group snapshot tools/delete_snapshot.py \
          --product "${PRODUCT_INPUT:-$REPOSITORY}" \
          "$SNAPSHOT_NAME"
    # }}}

    # Destroy {{{
    - name: Refresh the config
      id: select_stack
      if: ${{ inputs.action == 'destroy' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      # NOTE: A stack that was never created has nothing to leak, so saying so
      # and stopping there beats failing. It lets a cleanup job name every
      # stack a run may have spawned without knowing how far the run got.
      run: |-
        if pulumi stack select "$STACK_NAME" 2>/dev/null; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "No stack named $STACK_NAME, nothing to destroy"
        fi
    - name: Set mandatory config
      if: ${{ inputs.action == 'destroy' && steps.select_stack.outputs.found == 'true' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      # NOTE: We set mandatory config flags otherwise pulumi destroy fails because
      # some config is missing
      run: >-
        pulumi $PULUMI_DEFAULT_ARGS config refresh ||
          pulumi $PULUMI_DEFAULT_ARGS config set instance_image rocky-9
    - name: Destroy
      if: ${{ inputs.action == 'destroy' && steps.select_stack.outputs.found == 'true' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        MAX_ATTEMPTS: ${{ inputs.max_attempts }}
      # NOTE: Cancelled once and only here, where a lock can only be left by a
      # run that was killed. Doing it between attempts would abandon what the
      # destroy we just watched fail had in flight.
      run: |-
        pulumi $PULUMI_DEFAULT_ARGS cancel --yes || true
        for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
          if pulumi $PULUMI_DEFAULT_ARGS destroy --yes; then
            exit 0
          fi
          echo "Destroy failed [$attempt/$MAX_ATTEMPTS]"
          uv run --group snapshot tools/clean_orphan_ports.py || true
        done
        exit 1
    - name: Remove the stack
      if: ${{ inputs.action == 'destroy' && steps.select_stack.outputs.found == 'true' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |-
        pulumi $PULUMI_DEFAULT_ARGS stack rm --yes --remove-backups

    # }}}
