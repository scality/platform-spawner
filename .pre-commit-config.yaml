repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.12.9
  hooks:
  - id: ruff-check
  - id: ruff-format

- repo: local
  hooks:
  - id: readme-update
    name: README update
    language: python
    entry: ./tools/generate_docs.py
    files: ^(README\.md|Pulumi\.yaml)$
    additional_dependencies:
      - pyyaml~=6.0.2
