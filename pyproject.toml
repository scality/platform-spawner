[project]
name = "platform-spawner"
version = "0.1.0"
requires-python = "==3.14.5"
dependencies = [
  "pulumi==3.190.0",
  "pulumi-aws==7.4.0",
  "pulumi-command==1.1.0",
  "pulumi-tls==5.2.1",
  "requests~=2.32.0",
  "ruff==0.12.9",
]

[tool.ruff]
fix = true
show-fixes = true
output-format = "full"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "N807",
  "FBT",
  "D203",
  "D212",
  "COM812",
]

[tool.ruff.lint.pylint]
max-args = 10
