name: "Pre Merge"

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

# One run per branch at a time. On push, cancels any ongoing run since nobody
# is waiting for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run Pre-commit
        # NOTE: For now this action is not available in org
        # so let's do it manually
        #uses: pre-commit/action@v3.0.1
        shell: bash
        run: >-
          pip install pre-commit &&
          pre-commit run --show-diff-on-failure --color=always --all-files

  e2e-tests:
    uses: ./.github/workflows/e2e-tests.yaml
    needs: lint
    secrets: inherit

  pre-merge:
    name: Pre Merge
    # Single check for rulesets to require: GitHub reports one check per job, never one per workflow
    # always(): a job skipped because a dependency failed reports success and would let the PR merge
    if: always()
    needs:
      - lint
      - e2e-tests
    runs-on: ubuntu-26.04
    steps:
      - name: Fail if a pre-merge job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
