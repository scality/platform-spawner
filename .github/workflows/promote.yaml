name: Promote
run-name: "Promote ${{ github.ref_name }}"

on:
  push:
    tags:
      # We do not want to release major tags
      - "v*.*.*"

jobs:
  create-release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # NOTE: We explicitly set the refs otherwise the tag
          # annotations content is not fetched
          # See: https://github.com/actions/checkout/issues/882
          ref: ${{ github.ref }}
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Platform Spawner ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          # We consider pre-releases if the tag contains a hyphen
          # e.g. v1.2.3-alpha.0
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
