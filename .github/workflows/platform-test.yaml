name: "Platform Test"

on:
  workflow_call:
    inputs:
      name:
        description: "What the platform is called, in the job names"
        required: true
        type: string
      stack:
        description: "Name of the stack to spawn"
        required: true
        type: string
      configuration:
        description: "Configuration of the platform to spawn"
        required: true
        type: string
      checks:
        description: "Script to run against the spawned platform"
        required: true
        type: string
      existing_key:
        description: "Spawn on a key the cloud already holds and only an ssh-agent has (AWS only)"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  actions: read
  contents: read

# NOTE: Read by the OpenStack provider straight from the environment, the way
# the AWS one reads what the credentials step leaves behind. They are harmless
# to a platform spawned on AWS, which never looks. The password cannot be set
# here: a workflow level environment cannot read secrets.
env:
  OS_AUTH_URL: ${{ vars.OS_AUTH_URL }}
  OS_USERNAME: ${{ vars.OS_USERNAME }}
  OS_PROJECT_ID: ${{ vars.OS_PROJECT_ID }}
  OS_PROJECT_NAME: ${{ vars.OS_PROJECT_NAME }}
  # The variable holds the region, the tooling reads it under another name
  OS_REGION_NAME: ${{ vars.OS_REGION }}
  # Not configured anywhere, being the same for every OVH project
  OS_USER_DOMAIN_NAME: "Default"
  OS_PROJECT_DOMAIN_ID: "default"
  OS_IDENTITY_API_VERSION: "3"
  # Unique to the run, so that both jobs name the same key
  EXISTING_KEY_NAME: "e2e-${{ github.run_id }}-${{ inputs.name }}"

jobs:
  test:
    name: "${{ inputs.name }} test"
    runs-on: ubuntu-26.04
    env:
      OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NOTE: Needed whatever the provider, the stacks living in an S3 bucket
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_MAIN_ACCOUNT_ID }}:role/scality-github-e2e-infrastructure
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: eu-north-1

      # NOTE: The private half only ever lives in the agent, the way a key on
      # a token or in a password manager does. Left in a file under ~/.ssh,
      # ssh would find it on its own and the agent would go untested.
      - name: Hand the cloud a key held by an ssh-agent
        if: inputs.existing_key
        run: |-
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/existing-key"
          eval "$(ssh-agent -s)"
          ssh-add "$RUNNER_TEMP/existing-key"
          rm "$RUNNER_TEMP/existing-key"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          aws ec2 import-key-pair --key-name "$EXISTING_KEY_NAME" \
            --public-key-material "fileb://$RUNNER_TEMP/existing-key.pub"

      - name: Spawn platform
        uses: ./
        with:
          action: spawn
          artifacts_user: ${{ secrets.ARTIFACTS_USER }}
          artifacts_password: ${{ secrets.ARTIFACTS_PASSWORD }}
          stack_name: ${{ inputs.stack }}
          configuration: |-
            ${{ inputs.configuration }}
            ${{ inputs.existing_key && format('ssh_key_name: {0}', env.EXISTING_KEY_NAME) || '' }}

      - name: Check the platform
        env:
          CHECKS: ${{ inputs.checks }}
        run: ./"$CHECKS"

  destroy:
    name: "${{ inputs.name }} destroy"
    needs: test
    if: always()
    runs-on: ubuntu-26.04
    env:
      OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_MAIN_ACCOUNT_ID }}:role/scality-github-e2e-infrastructure
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: eu-north-1

      - name: Destroy platform
        uses: ./
        with:
          action: destroy
          stack_name: ${{ inputs.stack }}

      # NOTE: Even when the destroy fails. Nothing else ever collects a key
      # left behind.
      - name: Delete the key held by the ssh-agent
        if: always() && inputs.existing_key
        run: aws ec2 delete-key-pair --key-name "$EXISTING_KEY_NAME"
