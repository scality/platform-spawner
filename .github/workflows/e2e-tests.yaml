name: "End to End Tests"

on:
  workflow_call:

permissions:
  id-token: write
  actions: read
  contents: read

jobs:
  platform:
    # NOTE: Named, or the default is built out of every matrix value and the
    # whole configuration lands in the job name
    name: ${{ matrix.name }}
    strategy:
      # One platform failing says nothing about the others, and letting them
      # finish is what tells us whether the break is shared
      fail-fast: false
      matrix:
        include:
          - name: aws
            checks: tests/check_platform.sh
            configuration: |-
              provider: aws
              instance_image: rocky-9
          - name: openstack
            checks: tests/check_platform.sh
            configuration: |-
              provider: openstack
              instance_image: rocky-9
          # Everything a platform can be asked for at once, rather than a
          # spawn each
          - name: options
            checks: tests/check_options.sh
            configuration: |-
              provider: openstack
              instance_image: rocky-9
              instance_count: 2
              offline: true
              extra_networks:
                - name: storage
                - name: bonded
                  redundant: true
              extra_volumes:
                - size: 10
                  count: 2
    uses: ./.github/workflows/platform-test.yaml
    with:
      name: ${{ matrix.name }}
      stack: "${{ github.workflow }}-${{ github.run_number }}-${{ matrix.name }}"
      configuration: ${{ matrix.configuration }}
      checks: ${{ matrix.checks }}
    secrets: inherit

  snapshot:
    uses: ./.github/workflows/snapshot-test.yaml
    with:
      stack: "${{ github.workflow }}-${{ github.run_number }}-snapshot"
      snapshot: "e2e-${{ github.run_number }}"
    secrets: inherit
