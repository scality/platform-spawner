name: "Garbage Collection CRON"

on:
  workflow_dispatch:
  schedule:
    # Run it every day at midnight
    - cron: "0 0 * * *"

permissions:
  id-token: write
  actions: read
  contents: read

jobs:
  stack-to-delete:
    runs-on: ubuntu-24.04
    outputs:
      stacks: ${{ steps.list_stacks.outputs.stacks_list }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_MAIN_ACCOUNT_ID }}:role/scality-github-e2e-infrastructure
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: eu-north-1

      - name: List stacks to delete
        id: list_stacks
        uses: ./
        with:
          action: list
          # List stacks older than 4 hours
          age: 4

  garbage-collection:
    needs: stack-to-delete
    if: ${{ needs.stack-to-delete.outputs.stacks != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.stack-to-delete.outputs.stacks) }}
    runs-on: ubuntu-24.04
    env:
      # NOTE: A stack carries the provider it was spawned on, and the bucket
      # holds both, so collecting has to be able to reach either one. Without
      # these the OpenStack stacks fail to destroy and their instances stay up.
      OS_AUTH_URL: ${{ vars.OS_AUTH_URL }}
      OS_USERNAME: ${{ vars.OS_USERNAME }}
      OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
      OS_PROJECT_ID: ${{ vars.OS_PROJECT_ID }}
      OS_PROJECT_NAME: ${{ vars.OS_PROJECT_NAME }}
      OS_REGION_NAME: ${{ vars.OS_REGION }}
      OS_USER_DOMAIN_NAME: "Default"
      OS_PROJECT_DOMAIN_ID: "default"
      OS_IDENTITY_API_VERSION: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_MAIN_ACCOUNT_ID }}:role/scality-github-e2e-infrastructure
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: eu-north-1

      - name: Destroy platform
        uses: ./
        with:
          action: destroy
          stack_name: ${{ matrix.stack }}
