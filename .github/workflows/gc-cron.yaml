name: "Garbage Collection CRON"

on:
  workflow_dispatch:
  schedule:
    # Run it every day at midnight
    - cron: "0 0 * * *"

permissions:
  id-token: write
  actions: read
  contents: read

jobs:
  stack-to-delete:
    runs-on: ubuntu-24.04
    outputs:
      stacks: ${{ steps.list_stacks.outputs.stacks_list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_MAIN_ACCOUNT_ID }}:role/scality-github-e2e-infrastructure
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: eu-north-1

      - name: List stacks to delete
        id: list_stacks
        uses: ./
        with:
          action: list
          # List stacks older than 4 hours
          age: 4

  garbage-collection:
    needs: stack-to-delete
    if: ${{ needs.stack-to-delete.outputs.stacks != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.stack-to-delete.outputs.stacks) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_MAIN_ACCOUNT_ID }}:role/scality-github-e2e-infrastructure
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: eu-north-1

      - name: Destroy platform
        uses: ./
        with:
          action: destroy
          stack_name: ${{ matrix.stack }}
